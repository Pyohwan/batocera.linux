default batocera-vu8m

label batocera-vu8m
linux /boot/linux
fdt /boot/rk3568-odroid-m1.dtb
fdtoverlays /boot/overlays/display_vu8m.dtbo
append initrd=/boot/initrd.lz4 label=BATOCERA rootwait quiet loglevel=0 console=tty3 console=ttyS2,1500000n8

label batocera-hdmi-only
linux /boot/linux
fdt /boot/rk3568-odroid-m1.dtb
append initrd=/boot/initrd.lz4 label=BATOCERA rootwait quiet loglevel=0 console=tty3 console=ttyS2,1500000n8
