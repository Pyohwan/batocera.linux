[generic]
# Set to "display_vu8m" to enable the VU8M external DSI panel. Empty by
# default (HDMI only) - see board's create-boot-script.sh / boot.cmd for
# why: the DSI panel is a plain kernel-probed device once its overlay is
# applied, so with a display connected on both HDMI and VU8M at once, the
# very first frames drawn before EmulationStation's own output/rotation
# logic takes over (the boot splash) don't know which one to draw to and
# can render tiny and in the wrong orientation on HDMI. HDMI userspace
# priority (global.videooutput) still applies once ES starts either way,
# but this default avoids that splash-stage artifact for the common case.
overlays=""
