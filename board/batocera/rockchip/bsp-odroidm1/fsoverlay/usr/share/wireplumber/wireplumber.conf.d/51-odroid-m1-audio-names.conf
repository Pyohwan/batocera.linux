# WirePlumber's own built-in default for a freshly-activated route is
# 0.064 (cubic-scale) = 40% displayed - noticeable the first time a sink
# is switched to at runtime (boot already reapplies the saved
# audio.volume, default 80, via S27audioconfig/S28splash, but that only
# runs once at boot - switching outputs later in the session hits this
# raw WirePlumber default instead). 0.512 = 0.8^3 = 80%, matching the
# batocera-side default.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.512
}

# The ODROID-M1 has two ALSA cards live at once (HDMI + the onboard rk809
# mono speaker codec), and neither has a udev ID_FORM_FACTOR that isn't the
# ACP default "internal" - so PipeWire's alsa-card-profile compat layer
# (pa_alsa_device_init_description() in spa/plugins/alsa/acp/compat.c) gives
# both the same generic "Built-in Audio Stereo" description, making them
# indistinguishable in Settings > Sound. Same fix Hardkernel's own Ubuntu
# image ships (found live on this board's eMMC install, same rule shape,
# just different node/device names since ours come from a slightly
# different sysfs path).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output._sys_devices_platform_hdmi-sound_sound_card1.stereo-fallback" }
    ]
    actions = {
      update-props = {
        node.description = "HDMI Audio"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output._sys_devices_platform_rk809-sound_sound_card0.stereo-fallback" }
    ]
    actions = {
      update-props = {
        node.description = "Speaker (Mono)"
      }
    }
  }
  {
    matches = [
      { device.name = "alsa_card._sys_devices_platform_hdmi-sound_sound_card1" }
    ]
    actions = {
      update-props = {
        device.description = "HDMI Audio"
        device.nick = "HDMI Audio"
      }
    }
  }
  {
    matches = [
      { device.name = "alsa_card._sys_devices_platform_rk809-sound_sound_card0" }
    ]
    actions = {
      update-props = {
        device.description = "Speaker (Mono)"
        device.nick = "Speaker (Mono)"
      }
    }
  }
]
