image boot.vfat {
	vfat {
		extraargs = "-F 32 -n BATOCERA"
		@files
	}
	size = 6G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0"
	}
	size = "512M"
	# include files from TARGET_DIR/userdata
	mountpoint = "/userdata"
}

image batocera.img {
	hdimage {
		partition-table-type = "gpt"
		align = "1M"
	}

	# U-Boot is written starting at 32K (idbloader + u-boot.itb combined into
	# one image, correct offsets baked in by U-Boot's own build) but
	# deliberately kept OUT of the partition table, which is also what
	# vanilla Batocera does for this board. It is what decides whether this
	# card boots itself or goes through the on-board Petitboot, and the two
	# are mutually exclusive:
	#
	# The SPL locates the main-stage FIT by GPT entry *name* ("uboot", per
	# wiki.odroid.com/odroid-m1/software/building_u-boot). With that entry
	# present, the boot ROM runs this card's own SPL and U-Boot and the
	# SPI-NOR is never reached - Petitboot cannot appear at all, no matter
	# what is on the card. Without it, SPL prints "spl: partition error" and
	# falls through to "Trying to boot from MTD2", i.e. the SPI-NOR firmware,
	# which is exactly how the card ends up listed in the Petitboot menu.
	# That is the same thing Petitboot's author describes on the ODROID forum
	# (t=44346) when telling users a storage device carrying its own
	# bootloader outranks Petitboot and the bootloader has to go.
	#
	# Leaving it unregistered therefore is the feature, not an oversight, and
	# nothing is lost by it: `fw_setenv skip_spiboot true` in the Petitboot
	# shell makes the SPI-NOR U-Boot skip Petitboot and distro-boot straight
	# off this card's boot.scr instead (`false` restores the menu) - the same
	# script Petitboot itself reads, so VU8M and everything else behaves
	# identically either way. The image is still left byte-identical to a
	# self-booting one, so re-registering this entry is all it takes to go
	# back to direct SD boot.
	partition part_uboot {
		in-partition-table = "no"
		image = "../../uboot-odroid-m1/u-boot-rockchip.bin"
		offset = 32K
	}

	# The boot partition must be entry #1: the SPI-NOR Petitboot only finds a
	# bootable OS on the first partition (confirmed live - with it at #2,
	# nothing is listed even with a correct boot.scr present).
	partition vfat {
		partition-type-uuid = "F"
		image = "boot.vfat"
		offset = 16M
		bootable = "true"
	}

	partition userdata {
		partition-type-uuid = "L"
		image = "userdata.ext4"
	}
}
