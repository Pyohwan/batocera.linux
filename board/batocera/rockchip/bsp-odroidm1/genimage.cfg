image boot.vfat {
	vfat {
		extraargs = "-F 32 -n BATOCERA"
		@files
	}
	size = 6G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0"
	}
	size = "512M"
	# include files from TARGET_DIR/userdata
	mountpoint = "/userdata"
}

image batocera.img {
	hdimage {
		partition-table-type = "gpt"
		align = "1M"
	}

	partition part_idbloader {
		in-partition-table = "no"
		image = "../uboot-odroid-m1/idbloader.img"
		offset = 32K
	}

	# Registered as a real GPT partition named "uboot" to match Hardkernel's
	# documented procedure (wiki.odroid.com/odroid-m1/software/building_u-boot).
	# UART capture later confirmed the SPL (Hardkernel 2017.09) actually
	# locates the FIT image by a fixed sector offset (0x4000 = this 8M
	# offset), not by GPT label - the "spl: partition error" on both MMC1/
	# MMC2 seen with the old hybrid/in-partition-table="no" layout was a
	# normal first-attempt failure, not evidence that GPT registration was
	# required. Kept as a real GPT entry anyway since it's harmless and
	# matches the vendor-documented layout; the offset is what actually
	# matters for boot.
	partition uboot {
		partition-type-uuid = "L"
		image = "../uboot-odroid-m1/u-boot.itb"
		offset = 8M
		size = 4M
	}

	partition vfat {
		partition-type-uuid = "F"
		image = "boot.vfat"
		offset = 16M
		bootable = "true"
	}

	partition userdata {
		partition-type-uuid = "L"
		image = "userdata.ext4"
	}
}
