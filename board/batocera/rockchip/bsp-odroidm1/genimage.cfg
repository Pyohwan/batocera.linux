image boot.vfat {
	vfat {
		extraargs = "-F 32 -n BATOCERA"
		@files
	}
	size = 6G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0"
	}
	size = "512M"
	# include files from TARGET_DIR/userdata
	mountpoint = "/userdata"
}

image batocera.img {
	hdimage {
		partition-table-type = "gpt"
		align = "1M"
	}

	partition part_idbloader {
		in-partition-table = "no"
		image = "../uboot-odroid-m1/idbloader.img"
		offset = 32K
	}

	# Deliberately NOT a GPT table entry, so that the boot partition below
	# stays partition #1 - see the comment on it for why that matters.
	#
	# Hardkernel's wiki (wiki.odroid.com/odroid-m1/software/building_u-boot)
	# describes putting U-Boot in a GPT partition *named* "uboot", and this
	# was briefly done that way. UART capture then proved the SPL
	# (Hardkernel 2017.09) locates the FIT image purely by a fixed sector
	# offset (0x4000 = this 8M offset) and never looks at the partition
	# table at all - the "spl: partition error" on MMC1/MMC2 that motivated
	# the change is just a normal first-attempt failure printed either way.
	# So the GPT entry bought nothing and cost partition ordering; reverted
	# to the plain raw-offset layout every other rk board here uses.
	partition uboot {
		in-partition-table = "no"
		image = "../uboot-odroid-m1/u-boot.itb"
		offset = 8M
		size = 4M
	}

	# Must stay partition #1: the SPI-NOR Petitboot's boot.scr parser turns
	# our script's "${devnum}:${partition}" device specifier into a literal
	# device name and gets the partition index wrong, always landing on
	# <disk>p1 (confirmed live via pb-discover.log: "resource depends on
	# device /dev/mmcblk1p1" for all three of kernel/initrd/dtb, leaving the
	# otherwise-correctly-parsed "batocera.linux" boot option permanently
	# "unresolved"). That is also why the Petitboot author's own answer says
	# it looks at "the first partition" - it effectively can only do that.
	# With U-Boot no longer taking a table slot above, this lands at #1 and
	# the paths resolve. Nothing in our own boot chain depends on the index
	# (bootstd scans every partition for extlinux.conf; the rootfs is found
	# by LABEL=BATOCERA), so this is Petitboot's constraint alone.
	partition vfat {
		partition-type-uuid = "F"
		image = "boot.vfat"
		offset = 16M
		bootable = "true"
	}

	partition userdata {
		partition-type-uuid = "L"
		image = "userdata.ext4"
	}
}
