image boot.vfat {
	vfat {
		extraargs = "-F 32 -n BATOCERA"
		@files
	}
	size = 6G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0"
	}
	size = "512M"
	# include files from TARGET_DIR/userdata
	mountpoint = "/userdata"
}

image batocera.img {
	hdimage {
		partition-table-type = "gpt"
		align = "1M"
	}

	partition part_idbloader {
		in-partition-table = "no"
		image = "../uboot-odroid-m1/idbloader.img"
		offset = 32K
	}

	# Partition ENTRY ORDER below is deliberate and load-bearing: genimage
	# numbers GPT entries in the order they are declared here, independently
	# of their on-disk offsets (it only rejects actual overlaps - see
	# check_overlap() in genimage's image-hd.c). Two separate consumers each
	# constrain this, and they pull in opposite directions:
	#
	# - The SPL needs U-Boot in a real GPT entry *named* "uboot" (it locates
	#   it by label, per wiki.odroid.com/odroid-m1/software/building_u-boot).
	#   Dropping that entry - which was briefly done after misreading the
	#   UART log's "Trying fit image at 0x4000 sector" as proof that only the
	#   fixed offset mattered - breaks SD boot outright: SPL then prints an
	#   extra "spl: partition error" and falls through to "Trying to boot
	#   from MTD2", i.e. the SPI-NOR firmware, and the card's own U-Boot
	#   never runs.
	# - The SPI-NOR Petitboot only finds a bootable OS on partition #1
	#   (confirmed live: with the boot partition at #2 it lists nothing, even
	#   with a correct boot.scr present and no ":<part>" suffix in it).
	#
	# Declaring the boot partition first satisfies both: it becomes GPT #1
	# for Petitboot while U-Boot keeps its named entry (at #3) and its 8M
	# offset for the SPL. On-disk layout is unchanged either way.
	partition vfat {
		partition-type-uuid = "F"
		image = "boot.vfat"
		offset = 16M
		bootable = "true"
	}

	partition userdata {
		partition-type-uuid = "L"
		image = "userdata.ext4"
	}

	partition uboot {
		partition-type-uuid = "L"
		image = "../uboot-odroid-m1/u-boot.itb"
		offset = 8M
		size = 4M
	}
}
