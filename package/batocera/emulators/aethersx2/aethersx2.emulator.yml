cores:
  aethersx2:
    shared_features:
      - powermode
      - tdp
      - videomode
      - bezel
      - bezel_stretch
      - hud
      - hud_corner
      - use_guns
      - use_wheels
    custom_features:
      aethersx2_gfxbackend:
        submenu: RENDERING
        prompt: GRAPHICS API
        description: Choose which graphics API library to use. Vulkan is the only one confirmed working on this board's GPU driver - OpenGL/Auto will likely fail to start.
        choices:
          Vulkan: 14
          OpenGL: 12
          Software: 13
      aethersx2_resolution:
        submenu: RENDERING
        prompt: RENDERING RESOLUTION
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer. Higher settings need more GPU power.
        choices:
          Native (PS2): 1
          1.5x Native: 1.5
          2x Native (~720p): 2
          3x Native (~1080p): 3
          4x Native (~1440p/2K): 4
systems:
  - name: ps2
    exclude_extensions:
      - m3u
