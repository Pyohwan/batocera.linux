gamecube:
  emulator: libretro
  core:     dolphin
nds:
  emulator: drastic
  core:     drastic
wii:
  emulator: libretro
  core:     dolphin
fmtowns:
  emulator: libretro
  core:     mame
psx:
  options:
    hud_support: false # duckstation doesn't like it on n2+
n64:
  options:
    hud_support: false # mupen64plus standalone + mangohud's EGL hooking:
    # the Mali blob doesn't implement the EGL extension function(s)
    # mangohud's inject_egl looks for, so SDL_CreateWindow fails outright
    # ("Can't load EGL/GL library on window creation") - audio plays,
    # video never comes up. hud_support default is true globally
    # (configgen-defaults.yml) with no n64-specific override anywhere,
    # so this bit every rk3568 board with no in-game FPS counter as the
    # only symptom users could point to. ODROID-M1 confirmed on both
    # g13p0 and g24p0 Mali blobs.
ps2:
  emulator: libretro
  core:     play
flash:
  emulator: lightspark
  core:     lightspark
model3:
  emulator: supermodel
  core:     supermodel-legacy
  options:
    videomode: max-1920x1080
model2:
  emulator: libretro
  core:     mame
